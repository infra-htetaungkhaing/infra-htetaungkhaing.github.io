# Auto-deploy on every push to main (no manual deploy).
#
# This repo's Pages setting is currently "legacy" from branch main/root.
# PlanetLT has push access but not admin, so Actions cannot switch Pages to
# "GitHub Actions". Instead this workflow builds Vite and publishes the
# production files onto main (keeping source files), which legacy Pages serves.
name: Deploy Portfolio

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Vite entry
        run: cp index.template.html index.html

      - name: Build
        run: npm run build

      - name: Ensure .nojekyll exists
        run: touch dist/.nojekyll

      - name: Publish production files to main
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: main
          clean: true
          force: false
          commit-message: 'Publish production build [skip ci]'
          clean-exclude: |
            src
            public
            .github
            package.json
            package-lock.json
            vite.config.js
            index.template.html
            DEPLOY.md
            README.md
            .gitignore
            .oxlintrc.json
