# Builds the Vite app and publishes the production files to the gh-pages branch.
# One-time repo setting required:
#   Settings → Pages → Build and deployment → Source = "Deploy from a branch"
#   Branch = gh-pages / (root)
#
# Do NOT point Pages at the main branch root — that publishes raw Vite source
# (/src/main.jsx) and the live site stays on a white screen.
name: Deploy Portfolio

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure .nojekyll exists
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
